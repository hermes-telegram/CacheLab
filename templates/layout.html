<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CacheLab{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="/static/i18n.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(26, 26, 46, 0.7);
            --accent: #6c63ff;
            --accent-hover: #5a52e0;
            --success: #00d26a;
            --warning: #ffc107;
            --danger: #ff5252;
            --text: #e0e0e0;
            --text-muted: #9e9e9e;
            --border: rgba(108, 99, 255, 0.2);
            --glass: rgba(26, 26, 46, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at top right, rgba(108, 99, 255, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at bottom left, rgba(0, 210, 106, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* ── Navbar ── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        .navbar-brand i { font-size: 24px; }

        .navbar-links {
            display: flex;
            gap: 4px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(108, 99, 255, 0.15);
            color: var(--accent);
        }

        .nav-link i { margin-left: 6px; }

        /* ── Main Content ── */
        .main-content {
            margin-top: 64px;
            padding: 32px 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── Card ── */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i { color: var(--accent); }

        /* ── Grid ── */
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }

        /* ── Stat Badge ── */
        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .stat-badge.success { background: rgba(0, 210, 106, 0.15); color: var(--success); }
        .stat-badge.warning { background: rgba(255, 193, 7, 0.15); color: var(--warning); }
        .stat-badge.info { background: rgba(108, 99, 255, 0.15); color: var(--accent); }

        /* ── Button ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-success {
            background: var(--success);
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: rgba(108, 99, 255, 0.1); }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* ── Input ── */
        .input {
            width: 100%;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input:focus { border-color: var(--accent); }

        /* ── Table ── */
        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
        }

        .table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
        }

        .table tr:hover td { background: rgba(108, 99, 255, 0.05); }

        /* ── Result Box ── */
        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
        }

        .result-box:empty::before {
            content: 'نتیجه اینجا نمایش داده می‌شود...';
            color: var(--text-muted);
            direction: rtl;
        }

        /* ── Feature Card ── */
        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .feature-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.2);
        }

        .feature-card .icon {
            width: 48px; height: 48px;
            background: rgba(108, 99, 255, 0.15);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .feature-card h3 { font-size: 15px; margin-bottom: 4px; }
        .feature-card p { font-size: 13px; color: var(--text-muted); }

        /* ── Live Indicator ── */
        .live-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9999;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(12px);
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.info { border-color: var(--accent); }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .navbar { padding: 0 12px; }
            .nav-link span { display: none; }
            .main-content { padding: 20px 12px; }
        }
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- Navbar -->
<!-- ═══════════════════════════════════════════════════════════ -->
<nav class="navbar">
    <a href="/" class="navbar-brand">
        <i class="fas fa-bolt"></i>
        CacheLab
    </a>
    <div class="navbar-links">
        <button class="nav-link" id="langToggle" onclick="toggleLang()" style="cursor:pointer;border:none;">
            <i class="fas fa-globe"></i><span>FA</span>
        </button>
        <a href="/dashboard" class="nav-link" data-i18n="nav_dashboard">
            <i class="fas fa-tachometer-alt"></i><span>داشبورد</span>
        </a>
        <a href="/core" class="nav-link" data-i18n="nav_core">
            <i class="fas fa-database"></i><span>Core</span>
        </a>
        <a href="/advanced" class="nav-link" data-i18n="nav_advanced">
            <i class="fas fa-rocket"></i><span>Advanced</span>
        </a>
        <a href="/benchmark" class="nav-link" data-i18n="nav_benchmark">
            <i class="fas fa-chart-bar"></i><span>بنچمارک</span>
        </a>
        <a href="/admin" class="nav-link" data-i18n="nav_admin">
            <i class="fas fa-user-shield"></i><span>ادمین</span>
        </a>
    </div>
</nav>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- Main -->
<!-- ═══════════════════════════════════════════════════════════ -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // ── Toast System ──
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
        toast.innerHTML = `<i class="fas fa-${icon}"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // ── API Helper ──
    async function api(endpoint, options = {}) {
        const res = await fetch(endpoint, {
            headers: { 'Content-Type': 'application/json' },
            ...options,
        });
        return res.json();
    }
    
    // ── Language Toggle ──
    function toggleLang() {
        const newLang = window.i18n.current === 'fa' ? 'en' : 'fa';
        window.i18n.setLang(newLang);
    }

    // ── Live Socket ──
    const socket = io();
    socket.on('connect', () => console.log('Socket connected'));
    socket.on('live_stats', (data) => {
        if (window.onLiveStats) window.onLiveStats(data);
    });
    socket.on('metric', (data) => {
        if (window.onMetric) window.onMetric(data);
    });
</script>

{% block scripts %}{% endblock %}

</body>
</html>
